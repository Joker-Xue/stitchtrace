[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "stitchtrace"
version = "1.0.0.dev0"
description = "Record, replay and attribute tile-assembly decisions of tiled instance segmentation without re-running inference"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Xushen Lin", email = "2406010123@hhu.edu.cn"}]
keywords = ["instance segmentation", "tiled inference", "stitching", "provenance", "microscopy", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.26,<3"]
[project.optional-dependencies]
stardist = ["stardist==0.9.2", "tensorflow==2.21.0"]
cellpose = ["cellpose==4.2.1.1", "zarr==2.18.7", "dask", "distributed", "dask-image", "dask-jobqueue"]
test = ["pytest>=8"]
[project.scripts]
stitchtrace = "stitchtrace.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
stitchtrace = ["backends/compatibility.json"]
