name: ci
on:
  push:
  pull_request:

jobs:
  core:
    # The core must work with NumPy alone; capture tests skip when their backends are absent.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core and test dependencies only
        run: python -m pip install . pytest
      - name: Check that no inference backend is installed
        run: python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('stardist','cellpose','tensorflow','torch')))"
      - name: Tests
        run: python -m pytest -q
      - name: README quickstart
        run: |
          mkdir quickstart && cd quickstart
          python ../examples/make_demo_bundle.py demo
          stitchtrace verify demo
          stitchtrace replay demo --output native.npy
          stitchtrace replay demo --policy relink --output relinked.npy
          python -c "import numpy as np; np.save('ref.npy', np.load('demo/reference.npy'))"
          stitchtrace compare ref.npy relinked.npy --bundle demo
